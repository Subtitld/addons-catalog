# Subtitld add-ons catalog source list.
#
# Adding an add-on:
#   1. Push the add-on repo under github.com/Subtitld/<repo>.
#   2. Append an entry below, fill the `display_name`, `summary`, `tasks`,
#      `license` fields. These are static metadata and don't change per
#      release.
#   3. Cut a GitHub Release in the add-on repo: each release uploads zips
#      named  <id>-<version>-<platform>.zip  +  .sha256  sidecars.
#   4. The release workflow triggers a `repository_dispatch` here that
#      regenerates catalog.json automatically.
#
# Field reference — see build_catalog.py for the exact behaviour:
#   id              required, matches the manifest.json id inside each zip
#   repo            optional, defaults to `id` (use only if the GitHub repo
#                   name differs from the add-on id)
#   owner           optional, defaults to `Subtitld`
#   display_name    shown in the host UI list
#   summary         1-2 sentences, also shown in the list
#   tasks           [tts.synthesize | asr.transcribe | translate.text]+
#   languages       BCP-47 tags the add-on's voices/models support, e.g.
#                   [en-us, pt-br]. Powers the language filter dropdown
#                   in the host AddonsDialog at *browse* time, before
#                   the user installs the add-on. Should mirror the
#                   `languages` field of the manifest.json shipped in
#                   the release zip; the host honours the installed
#                   manifest once installed, but until then this is the
#                   only source.
#   license         SPDX or short string; per-model licenses live inside
#                   the zip's manifest.json
#   homepage        optional, defaults to https://github.com/Subtitld/<repo>
#   icon            optional URL of a 128x128 PNG
#   min_subtitld    optional override of the default 0.6.0 floor

min_subtitld: "0.6.0"

addons:
  - id: piper-tts
    repo: addon-piper-tts        # GitHub repo name; the addon `id` is the
                                  # stable manifest identifier and stays bare,
                                  # but the repo carries the `addon-` prefix
                                  # so it sorts together with sibling add-ons
                                  # under the Subtitld org.
    display_name: "Piper TTS (offline)"
    summary: "Lightweight offline neural TTS based on Piper. 158 voices across 49 languages; per-voice models range 20-110 MB."
    tasks: [tts.synthesize]
    # Full BCP-47 language list mirrors the upstream rhasspy/piper-voices
    # catalog. Kept in sync by regenerating from voices.json — see
    # tools/regen_piper_manifest.py in the addon-piper-tts repo. The host's
    # AddonsDialog uses RFC 4647 prefix matching, so a user filtering by
    # `pt` will still match `pt-br` / `pt-pt` rows.
    languages: [
      ar-jo, bg-bg, ca-es, cs-cz, cy-gb, da-dk, de-de, el-gr, en-gb, en-us,
      es-ar, es-es, es-mx, eu-es, fa-ir, fi-fi, fr-fr, hi-in, hu-hu, id-id,
      is-is, it-it, ka-ge, kk-kz, ku-tr, lb-lu, lv-lv, ml-in, ne-np, nl-be,
      nl-nl, no-no, pl-pl, pt-br, pt-pt, ro-ro, ru-ru, sk-sk, sl-si, sq-al,
      sr-rs, sv-se, sw-cd, te-in, tr-tr, uk-ua, ur-pk, vi-vn, zh-cn
    ]
    # Upstream relicensed at piper1-gpl: the python wrapper we link against
    # ships GPL-3.0-or-later. We invoke it as a separate process, not a
    # shared library, so GPL doesn't propagate to Subtitld's MIT codebase.
    license: "MIT (add-on glue) + GPL-3.0-or-later (Piper, OHF-voice/piper1-gpl) + per-model licenses (often CC-BY)"

  - id: coqui-xtts
    repo: addon-coqui-xtts       # See note on piper-tts above.
    display_name: "Coqui XTTS-v2 (offline + voice clone)"
    summary: "Multilingual neural TTS with 6-second voice cloning. Heavy: ~2 GB model, CPU or CUDA."
    tasks: [tts.synthesize]
    languages: [en, es, fr, de, it, pt, pl, tr, ru, nl, cs, ar, zh-cn, ja, hu, ko]
    license: "MPL 2.0 (XTTS) + CPML for the v2 model — non-commercial without a Coqui license"

  - id: qwen3-tts
    repo: addon-qwen3-tts        # See note on piper-tts above.
    display_name: "Qwen3-TTS (offline, 1.7B)"
    # Twin to coqui-xtts but Apache-2.0, so it lights up the dub workflow
    # for users who can't accept CPML's non-commercial restriction. Two
    # voice modes: 9 fixed timbres baked into the CustomVoice variant, and
    # a `qwen3-clone` voice that switches the addon to the Base variant
    # for 3-second voice cloning. Single-active-model cache keeps RAM
    # ~4 GB instead of ~7 GB.
    summary: "Multilingual neural TTS with 9 premium timbres + 3-second voice cloning. Heavy: ~3.5 GB model, 8+ GB RAM, CPU or CUDA."
    tasks: [tts.synthesize]
    # 10 languages per the Qwen3-TTS-12Hz model card. Using BCP-47 short
    # tags (no -region) since Qwen doesn't differentiate dialect in the
    # voice list — the AddonsDialog's RFC 4647 prefix matcher will still
    # surface this addon for `en-us`, `pt-br`, etc.
    languages: [zh-cn, en, ja, ko, de, fr, ru, pt, es, it]
    license: "Apache-2.0 (wrapper) + Apache-2.0 (Qwen3-TTS weights)"

  - id: kokoro
    repo: addon-kokoro           # See note on piper-tts above.
    display_name: "Kokoro 82M (offline, lightweight)"
    # The light end of the catalog. ~80 MB on disk, sub-second per line
    # on a midrange CPU, no GPU required. 54 preset voices spread
    # across 9 languages — Kokoro doesn't have an audio-encoder path
    # so it can't clone, but it makes up for it with breadth at a tiny
    # footprint. Good first install for users who just want a working
    # offline TTS with multiple language coverage.
    summary: "Lightweight offline neural TTS. ~80 MB model, sub-second per line on CPU, 54 preset voices across 9 languages. No voice cloning."
    tasks: [tts.synthesize]
    # Kokoro's pipeline lang_code is single-letter (a/b/j/z/e/f/h/i/p),
    # but we map them to BCP-47 in the manifest so the host's RFC 4647
    # prefix matcher works the same as for the other addons.
    languages: [en-us, en-gb, ja, zh, es, fr, hi, it, pt-br]
    license: "Apache-2.0 (wrapper) + Apache-2.0 (Kokoro 82M weights)"

  - id: f5-tts
    repo: addon-f5-tts           # See note on piper-tts above.
    display_name: "F5-TTS (offline, voice clone)"
    # Voice-clone-only — there are no preset voices. Every request
    # needs a 6-15 second reference WAV (per-request voice_ref_audio
    # or addon-config-level fallback). Catalog UI should make this
    # constraint visible: without a reference, the addon can't
    # synthesize at all. The single voice id is `f5-clone`.
    #
    # Trained on Emilia ZH-EN (~100k h), so en+zh are the only
    # officially-supported languages. Community checkpoints exist for
    # ja/fr/de/hi/it/ru/es/fi but require swapping the model file —
    # out of scope for v1, would be a sibling addon.
    #
    # Model weights are CC-BY-NC-4.0 (non-commercial only). We surface
    # this in the license string so the AddonsDialog can warn users
    # before they install — same pattern as coqui-xtts's CPML clause.
    summary: "Voice-clone neural TTS. Single 'f5-clone' voice; every request needs a 6-15s reference clip. ~1.5 GB model, en+zh only."
    tasks: [tts.synthesize]
    languages: [en, zh]
    license: "MIT (wrapper) + CC-BY-NC-4.0 (F5TTS_v1_Base weights, non-commercial only)"

  - id: parler-tts
    repo: addon-parler-tts       # See note on piper-tts above.
    display_name: "Parler-TTS Mini v1 (offline, prompt-driven)"
    # Unusual model — no preset voices, no reference-audio cloning.
    # Voice is described in plain English ("A female speaker with a
    # slightly low-pitched voice, clear close-mic recording, no
    # background noise.") and the model produces speech matching the
    # description. To fit Subtitld's voice-id-driven UI, we expose
    # 34 named consistent speakers the Parler team trained on (Jon,
    # Lea, Gary, Jenna, Mike, Laura recommended). Each id maps to a
    # description template that bakes in the speaker name.
    #
    # Users can override the description via the per-speaker
    # voice_description config field or the per-request `description`
    # parameter.
    #
    # English only — multilingual variants are planned upstream but
    # not yet released as Apache-2.0 weights.
    summary: "Prompt-driven offline TTS. 34 named consistent speakers + free-text voice description. ~2 GB model, ~10-30s per line on CPU, English only."
    tasks: [tts.synthesize]
    languages: [en]
    license: "Apache-2.0 (wrapper) + Apache-2.0 (Parler-TTS Mini v1 weights)"

  - id: supertonic
    repo: addon-supertonic       # See note on piper-tts above.
    display_name: "Supertonic (on-device, ONNX, 99M)"
    # Lightest neural TTS on the catalog — pure onnxruntime, no torch
    # dependency tree. Bundle is ~200 MB and the Supertonic-3 model is
    # ~400 MB downloaded on first synthesis from Hugging Face. 10
    # preset timbres only (M1-M5, F1-F5) — no clone-from-audio at
    # request time because the upstream `supertonic` Python SDK
    # doesn't expose a runtime cloning API; cloning happens out-of-band
    # via Supertone's Voice Builder web UI, exporting a JSON the
    # add-on can load via its `voice_style_json` config option. Pitched
    # as the "low-overhead default" — when users want voice clones or
    # accent control they should reach for coqui-xtts / qwen3-tts /
    # f5-tts instead.
    summary: "Lightning-fast on-device multilingual TTS. 99M-parameter ONNX model, ~400 MB download, 31 languages, 10 preset voices. No GPU required."
    tasks: [tts.synthesize]
    # All 31 supported ISO codes, surfaced as plain language tags so
    # the AddonsDialog's RFC 4647 prefix matcher catches `pt-br` /
    # `pt-pt` filters under `pt`, etc. The literal `na` (language-
    # agnostic) is a synthesis option inside the addon, not a real
    # language — kept out of the filter list intentionally.
    languages: [
      ar, bg, hr, cs, da, nl, en, et, fi, fr, de, el, hi, hu, id,
      it, ja, ko, lv, lt, pl, pt, ro, ru, sk, sl, es, sv, tr, uk, vi
    ]
    license: "MIT (wrapper) + MIT (supertonic-py) + OpenRAIL-M (Supertonic-3 weights)"

  - id: audio-separator
    repo: addon-audio-separator  # See note on piper-tts above.
    display_name: "audio-separator (UVR / MDX / Demucs)"
    # Subprocess sibling to the host's built-in `ffmpeg-separator` (which
    # uses a stereo mid/side trick — fast, zero deps, mediocre quality on
    # tracks with center-panned instruments). Same output contract
    # (`{vocals, background}`), much better quality at the cost of a
    # one-shot model download and a few seconds of inference per minute.
    # Default model `Kim_Inst.onnx` (~67 MB) is the standard high-quality
    # MDX-Net instrumental model; users can switch to BS-Roformer (top
    # quality, slow) or Demucs (4-stem) via the per-addon config.
    summary: "High-quality vocal/music separation using UVR, MDX-Net, BS-Roformer, and Demucs models. Quality > the built-in ffmpeg mid/side trick at the cost of a one-shot model download (~50-500 MB) and a few seconds of inference per minute."
    tasks: [audio.separate]
    # Audio separation operates on the waveform, not the language track.
    # Leave `languages` empty intentionally — the AddonsDialog's language
    # filter would hide this row when the user picks a specific tag, which
    # is correct: a user shopping for "pt-br" providers cares about TTS /
    # ASR coverage, not the separator. Under "Any language" (the default)
    # the empty-languages row passes through and the user sees it.
    license: "MIT (wrapper) + MIT (python-audio-separator) + per-model licenses (some UVR/MDX checkpoints are CC-BY-NC for non-commercial use)"

  - id: vosk
    repo: addon-vosk
    display_name: "Vosk (offline ASR)"
    # Lightweight offline speech-to-text via Vosk Kaldi recognizers. CPU-only,
    # no torch; per-language models download on demand (~40 MB small models,
    # up to ~1.8 GB full). Sibling to the heavier whisper-based ASR add-ons.
    summary: "Offline speech-to-text using Vosk Kaldi recognizers. Lightweight and CPU-only; per-language models download on demand (~40 MB small, up to ~1.8 GB full)."
    tasks: [asr.transcribe]
    languages: [en, en-us, pt, pt-br, es, es-es, fr, fr-fr, de, de-de, it, it-it, ru, zh, zh-cn, ja]
    license: "Apache-2.0 (wrapper + Vosk); some full models are GPL-3.0"

  - id: realtimestt
    repo: addon-realtimestt
    display_name: "RealtimeSTT (faster-whisper)"
    # Recording-based STT for Record mode: the host streams mic audio and the
    # add-on transcribes live via RealtimeSTT (faster-whisper + VAD). Serves
    # both the batch asr.transcribe and the live asr.stream task. GPU-accel
    # when available; the chosen whisper model downloads on first use.
    summary: "Recording-based speech-to-text via RealtimeSTT (faster-whisper + VAD) for Record mode; also transcribes imported audio. GPU-accelerated when available."
    tasks: [asr.transcribe, asr.stream]
    languages: [en, en-us, pt, pt-br, es, fr, de, it, nl, ru, zh, ja, ko]
    license: "MIT (wrapper + RealtimeSTT + faster-whisper); Whisper weights MIT"
